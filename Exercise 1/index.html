<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scratch2Build — Week 4 Cohort Roster</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                background: #0f172a;
                color: #f8fafc;
                padding: 2rem;
            }
            h1 {
                color: #38bdf8;
            }
            #squad-roster {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 1rem;
                margin-top: 1.5rem;
            }
            .member-card {
                background: #1e293b;
                border: 1px solid #334155;
                border-radius: 8px;
                padding: 1rem;
            }
            .member-card h2 {
                margin: 0 0 0.5rem;
                font-size: 1.1rem;
                color: #f1f5f9;
            }
            .member-card p {
                margin: 0.25rem 0;
                font-size: 0.9rem;
                color: #94a3b8;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Scratch2Build — Week 4 Squad Roster</h1>
            <p>
                Add your onboarding card inside <code>#squad-roster</code> via a
                feature branch PR.
            </p>
        </header>

        <main>
            <section id="squad-roster">
                <!-- SAMPLE CARD (Do not delete — add yours below!) -->
                <article class="member-card">
                    <h2>Ahmed Wael</h2>
                    <p><strong>Squad:</strong> Tech Leadership</p>
                    <p><strong>Role:</strong> Tech Lead</p>
                </article>

                <!-- TODO: Paste your <article class="member-card"> block below this line -->
                    <article class="member-card">
                        <h2>Ali Abdelhamid</h2>
                        <p><strong>Squad:</strong> Software Heroes</p>
                        <p><strong>Role:</strong> Frond-end develper</p>
                    </article>
            </section>
        </main>
    </body>
</html>
